<body class="bg-surface-container-low min-h-screen flex items-center justify-center font-body-md text-on-surface antialiased selection:bg-primary selection:text-on-primary">

<p class="font-body-lg text-body-lg text-on-primary/90">Join the elite. Access exclusive gear and training protocols.</p>
</div>
</div>
<div class="w-full md:w-1/2 flex items-center justify-center p-gutter lg:p-margin bg-surface-bright">
<div class="w-full max-w-[440px] bg-surface-container-lowest rounded-2xl shadow-[0_4px_24px_rgba(0,0,0,0.06)] border border-outline-variant p-xl lg:p-xxl relative overflow-hidden">
<div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-primary to-secondary-container"></div>
<div class="text-center mb-xl">
<h1 class="font-display-lg text-display-lg font-black italic tracking-tighter text-on-surface mb-xs">SPORT PRO</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant">Sign in to your athlete profile</p>
</div>
<form class="space-y-lg">
<div class="space-y-sm relative">
<label class="font-label-md text-label-md uppercase text-on-surface block tracking-wider" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">mail</span>
<input class="w-full bg-surface-container-low border border-outline-variant py-sm pr-sm pl-[40px] rounded-xl font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="email" placeholder="athlete@sportpro.com" type="email"/>
</div>
</div>
<div class="space-y-sm relative">
<div class="flex justify-between items-baseline">
<label class="font-label-md text-label-md uppercase text-on-surface block tracking-wider" for="password">Password</label>
<a class="font-label-sm text-label-sm text-primary hover:text-surface-tint transition-colors uppercase tracking-wider" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-sm top-1/2 -translate-y-1/2 text-outline" style="font-variation-settings: 'FILL' 0;">lock</span>
<input class="w-full bg-surface-container-low border border-outline-variant py-sm pr-sm pl-[40px] rounded-xl font-body-md text-on-surface focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary font-label-lg text-label-lg uppercase tracking-widest py-md rounded-xl hover:bg-surface-tint active:scale-[0.98] transition-all shadow-[0_4px_12px_rgba(0,88,188,0.2)] mt-xl flex items-center justify-center gap-xs" type="button">
                        SIGN IN
                        <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<p class="mt-xl text-center font-body-sm text-body-sm text-on-surface-variant">
                    NEW TO SPORT PRO? 
                    <a class="font-label-sm text-label-sm text-primary uppercase tracking-wider ml-xs hover:underline decoration-2 underline-offset-4" href="#">CREATE ACCOUNT</a>
</p>

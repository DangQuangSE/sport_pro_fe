name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
      - master
      - feat/dashboard-admin
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
      - master
      - feat/dashboard-admin

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          # 🚨 CẢNH BÁO BẢO MẬT: KHÔNG ĐƯỢC HARDCODE token vào đây.
          # Luôn dùng ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }} được tạo tự động bởi Azure hoặc cấu hình thủ công trong GitHub Secrets.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/" # Next.js source code is in root
          api_location: "" # No serverless API here
          output_location: "" # SWA builder automatically finds and builds Next.js
        env:
          # 🚨 CẢNH BÁO BẢO MẬT: Tránh đưa trực tiếp API URL hoặc các khóa nhạy cảm vào code.
          # Sử dụng GitHub Secrets để quản lý biến NEXT_PUBLIC_API_URL cho môi trường sản phẩm (Production).
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
